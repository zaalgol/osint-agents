# Local model endpoints and roles. Any OpenAI-compatible server works (Ollama, llama.cpp, vLLM).
local:
  backend: ollama                 # ollama (native API, schema-constrained) | openai (llama.cpp, vLLM)
  base_url: http://127.0.0.1:11434/v1
  api_key: ollama                 # ignored by Ollama, required by the client
  exclusive: true                 # one chat model at a time: 14B + 27B don't fit in 16 GB VRAM,
                                  # and the overflow lands in system RAM
  roles:
    agent:                        # extraction, triage, query expansion, translation
      model: huihui_ai/qwen3-abliterated:14b
      context: 16384              # per slot; x OLLAMA_NUM_PARALLEL must fit in VRAM
      temperature: 0.2
      keep_alive: 10m
      max_output_tokens: 6000     # a 7k-char chunk's JSON fits; stops runaway generations
    agent_heavy:                  # harder extraction / resolution judging
      model: qwen3.6:27b
      context: 16384
      temperature: 0.2
      keep_alive: 1m              # big (spills into RAM): release soon after use
      max_output_tokens: 6000
    vision:                       # OCR of images and scanned PDFs (needs a vision model)
      model: qwen3.6:27b
      context: 8192               # one image + its transcript; a smaller KV cache saves RAM
      temperature: 0.0
      keep_alive: 1m
      max_output_tokens: 4000
    embedding:
      model: bge-m3
      dimensions: 1024            # must match the vector columns in the DB schema

# Claude Code CLI (headless) jobs -> model.
claude:
  binary: claude
  default_model: sonnet
  use_api_key: false              # never bill the API; jobs run on the Max subscription
  jobs:
    plan_investigation: sonnet
    analyze_investigation: opus
    threat_assessment: opus
    link_investigations: sonnet
    red_team: opus
    report: opus
    citation_audit: sonnet
    ask: sonnet
  max_turns:                      # tool-use turns per job (bounds quota per run)
    plan_investigation: 25
    analyze_investigation: 60
    report: 50
    citation_audit: 30
    link_investigations: 40
    red_team: 40
    threat_assessment: 50
    ask: 20
