[project]
name = "osint-agents"
version = "0.1.0"
description = "Agent-based OSINT system: local-LLM collection, Claude analysis, persistent cross-investigation knowledge base with citations and proofs."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "pyyaml>=6.0",
    "typer>=0.15",
    "rich>=13.9",
    "sqlalchemy>=2.0.36",
    "psycopg[binary]>=3.2",
    "alembic>=1.14",
    "pgvector>=0.3.6",
    "neo4j>=5.26",
    "httpx[brotli,socks]>=0.28",
    "warcio>=1.7",
    "trafilatura>=2.0",
    "feedparser>=6.0",
    "playwright>=1.48",
    "pymupdf>=1.25",
    "mcp>=1.6",
    "markdown>=3.7",
    "rapidfuzz>=3.10",
    "anyascii>=0.3",
    "networkx>=3.4",
    "cryptography>=44",
    "yt-dlp>=2025.1",
    "dnspython>=2.7",
    "psutil>=6.0",
    "pillow>=12.3.0",
]

[project.optional-dependencies]
ner = [
    "gliner>=0.2.16",
]
media = [
    "faster-whisper>=1.1",          # speech-to-text for videos without captions
    "opencv-python-headless>=5.0",  # face redaction (YuNet detector; 4.x DLLs are blocked here)
]
dev = [
    "pytest>=8.3",
    "stix2>=3.0",
    "ruff>=0.8",
]

[project.scripts]
osint = "osint.cli:app"

# Built-in plugins are registered exactly like third-party ones would be.
[project.entry-points."osint.plugins"]
echo_collector = "osint.plugins.collectors.echo:EchoCollector"
web_collector = "osint.plugins.collectors.web:WebCollector"
searxng_collector = "osint.plugins.collectors.searxng:SearxngCollector"
rss_collector = "osint.plugins.collectors.rss:RssCollector"
telegram_public_collector = "osint.plugins.collectors.telegram_public:TelegramPublicCollector"
wayback_collector = "osint.plugins.collectors.wayback:WaybackCollector"
gdelt_collector = "osint.plugins.collectors.gdelt:GdeltCollector"
youtube_collector = "osint.plugins.collectors.youtube:YoutubeCollector"
rdap_enricher = "osint.plugins.enrichers.rdap:RdapEnricher"
geocode_enricher = "osint.plugins.enrichers.geocode:GeocodeEnricher"
btc_enricher = "osint.plugins.enrichers.btc:BtcEnricher"
sanctions_enricher = "osint.plugins.enrichers.sanctions:SanctionsEnricher"
stix_exporter = "osint.plugins.exporters.formats:StixExporter"
ftm_exporter = "osint.plugins.exporters.formats:FtmExporter"
gexf_exporter = "osint.plugins.exporters.formats:GexfExporter"
llm_extractor = "osint.plugins.extractors.llm:LLMExtractor"
gliner_extractor = "osint.plugins.extractors.gliner_ner:GlinerExtractor"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/osint"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: needs running docker services (postgres/neo4j)"]

[tool.ruff]
line-length = 100
target-version = "py312"
