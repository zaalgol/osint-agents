<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="csrf" content="__CSRF__">
<title>OSINT Workbench</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/cytoscape/3.30.2/cytoscape.min.js"></script>
<style>
:root {
  --bg: #f6f7f9; --panel: #ffffff; --ink: #1c1f24; --muted: #667085; --line: #e3e6eb;
  --accent: #2f5bd3; --warn: #b54708; --bad: #b42318; --ok: #067647; --chip: #eef2fb;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111317; --panel: #191c21; --ink: #e7e9ed; --muted: #9aa3b2; --line: #2a2f37;
    --accent: #7ea2ff; --warn: #f5a524; --bad: #ff6b6b; --ok: #45c08a; --chip: #222a3a;
  }
}
:root[data-theme="dark"] {
  --bg: #111317; --panel: #191c21; --ink: #e7e9ed; --muted: #9aa3b2; --line: #2a2f37;
  --accent: #7ea2ff; --warn: #f5a524; --bad: #ff6b6b; --ok: #45c08a; --chip: #222a3a;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink);
  font: 14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
header { display: flex; align-items: center; gap: 12px; padding: 10px 16px;
  border-bottom: 1px solid var(--line); background: var(--panel); position: sticky; top: 0; z-index: 5; }
header h1 { font-size: 15px; margin: 0; font-weight: 650; }
header select { font: inherit; padding: 4px 8px; border: 1px solid var(--line); border-radius: 6px;
  background: var(--bg); color: var(--ink); max-width: 60vw; }
nav { display: flex; gap: 2px; padding: 0 16px; border-bottom: 1px solid var(--line);
  background: var(--panel); overflow-x: auto; }
nav button { border: 0; background: none; color: var(--muted); padding: 10px 12px; font: inherit;
  cursor: pointer; border-bottom: 2px solid transparent; white-space: nowrap; }
nav button.on { color: var(--ink); border-bottom-color: var(--accent); font-weight: 600; }
main { padding: 16px; display: grid; grid-template-columns: minmax(0, 1fr) 380px; gap: 16px; }
@media (max-width: 960px) { main { grid-template-columns: 1fr; } }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px; }
.card h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted);
  margin: 0 0 10px; }
.stats { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 10px; }
.stat b { display: block; font-size: 22px; } .stat span { color: var(--muted); font-size: 12px; }
#cy { height: 70vh; min-height: 420px; border-radius: 8px; }
table { width: 100%; border-collapse: collapse; }
td, th { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { color: var(--muted); font-weight: 600; font-size: 12px; }
.chip { display: inline-block; padding: 1px 8px; border-radius: 99px; background: var(--chip);
  font-size: 12px; margin: 0 4px 4px 0; }
.chip.warn { color: var(--warn); } .chip.bad { color: var(--bad); } .chip.ok { color: var(--ok); }
.muted { color: var(--muted); } .small { font-size: 12px; }
blockquote { margin: 6px 0; padding: 4px 10px; border-left: 3px solid var(--accent);
  background: var(--bg); border-radius: 0 6px 6px 0; }
a { color: var(--accent); }
.list > div { padding: 8px 0; border-bottom: 1px solid var(--line); }
.empty { color: var(--muted); padding: 24px; text-align: center; }
#side { position: sticky; top: 100px; align-self: start; max-height: calc(100vh - 120px); overflow: auto; }
</style>
</head>
<body>
<header>
  <h1>OSINT Workbench</h1>
  <select id="inv" aria-label="Investigation"></select>
  <span class="muted small" id="meta"></span>
</header>
<nav id="tabs"></nav>
<main>
  <section id="view"></section>
  <aside id="side" class="card"><h2>Details</h2>
    <div class="muted">Select an entity in the graph or a row to see its evidence.</div></aside>
</main>
<script>
"use strict";
// All data comes from collected (untrusted) sources: build DOM with textContent only.
const $ = (sel) => document.querySelector(sel);
function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (k === "class") el.className = v;
    else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else if (v !== null && v !== undefined) el.setAttribute(k, v);
  }
  for (const kid of kids.flat()) {
    if (kid === null || kid === undefined || kid === false) continue;
    el.append(kid instanceof Node ? kid : document.createTextNode(String(kid)));
  }
  return el;
}
const api = (p) => fetch(p).then((r) => r.json());
const TABS = ["Overview", "Graph", "Timeline", "Findings", "Reports", "Evidence", "Review"];
const CSRF = document.querySelector('meta[name="csrf"]').content;
async function post(path, body) {
  const r = await fetch(path, { method: "POST", headers: { "Content-Type": "application/json",
    "X-CSRF-Token": CSRF }, body: JSON.stringify(body) });
  return { ok: r.ok, data: await r.json() };
}
const COLORS = { person: "#2f5bd3", organization: "#7a3fd1", armed_group: "#c0392b",
  location: "#16865a", online_account: "#b7791f", channel: "#b7791f", domain: "#0e7490",
  url: "#0e7490", email: "#0e7490", ip_address: "#0e7490", crypto_wallet: "#a16207" };
let state = { inv: null, tab: "Overview" };

function side(...kids) {
  const s = $("#side");
  s.replaceChildren(h("h2", {}, "Details"), ...kids.filter((k) => k !== null && k !== undefined && k !== false));
}

function evidenceBlock(marker, ev) {
  if (!ev) return h("div", { class: "small muted" }, marker);
  return h("div", {},
    h("blockquote", {}, ev.quote || "(media)"),
    h("div", { class: "small muted" }, marker, " · ",
      h("a", { href: ev.url, target: "_blank", rel: "noopener noreferrer" }, ev.url || ""),
      " · captured ", (ev.captured_at || "").slice(0, 16), " · sha256 ", (ev.sha256 || "").slice(0, 12), "…",
      ev.collected_in ? " · in " + ev.collected_in.map((i) => i.name).join(", ") : ""));
}

async function showEntity(eid) {
  side(h("div", { class: "muted" }, "Loading…"));
  const e = await api(`/api/entity/${eid}?inv=${state.inv}`);
  if (e.error) return side(h("div", {}, e.error));
  const det = e.evidence_detail || {};
  const rels = e.relations.map((r) => h("div", {},
    h("div", {}, r.direction === "out" ? "→ " : "← ", h("b", {}, r.type), " ",
      h("a", { href: "#", onclick: (ev) => { ev.preventDefault(); showEntity(r.other.entity_id); } }, r.other.name),
      r.support ? h("span", { class: "chip" + (r.support.independent_sources < 2 ? " warn" : " ok") },
        `${r.support.independent_sources} independent source(s)`) : null),
    r.evidence.slice(0, 2).map((m) => evidenceBlock(m, det[m]))));
  const evs = e.events.map((v) => h("div", {},
    h("div", {}, h("b", {}, v.type), ` (${v.role}, ${v.time || "undated"}): `, v.description),
    v.evidence.slice(0, 1).map((m) => evidenceBlock(m, det[m]))));
  side(
    h("div", {}, h("b", { style: "font-size:16px" }, e.name), " ", h("span", { class: "chip" }, e.type)),
    e.aliases.length > 1 ? h("div", { class: "small muted" }, "aliases: " + e.aliases.join(", ")) : null,
    h("div", { class: "small muted" }, "investigations: " + e.investigations.map((i) => i.name).join(", ")),
    Object.keys(e.attributes || {}).length ? h("details", {}, h("summary", {}, "attributes"),
      h("pre", { class: "small" }, JSON.stringify(e.attributes, null, 1))) : null,
    h("h2", { style: "margin-top:12px" }, `Relations (${e.relations.length})`), h("div", { class: "list" }, rels),
    h("h2", { style: "margin-top:12px" }, `Events (${e.events.length})`), h("div", { class: "list" }, evs));
}

const views = {
  async Overview(root) {
    const o = await api(`/api/inv/${state.inv}/overview`);
    const c = o.counts;
    const stat = (n, label) => h("div", { class: "stat" }, h("b", {}, n ?? 0), h("span", {}, label));
    root.append(
      h("div", { class: "card" }, h("h2", {}, o.investigation.name),
        h("p", { class: "muted" }, (o.investigation.seed || {}).focus || ""),
        h("div", { class: "stats" }, stat(c.artifact, "artifacts"), stat(c.document, "documents"),
          stat(c.entity, "entities"), stat(c.relation, "relations"), stat(c.event, "events"),
          stat(c.findings, "findings"), stat(c.open_review_items, "to review"))),
      h("div", { class: "card", style: "margin-top:16px" }, h("h2", {}, "Most connected"),
        h("table", {}, h("tr", {}, h("th", {}, "entity"), h("th", {}, "type"), h("th", {}, "links")),
          o.top_entities.map((t) => h("tr", { onclick: () => showEntity(t.entity_id), style: "cursor:pointer" },
            h("td", {}, t.name), h("td", {}, h("span", { class: "chip" }, t.type)), h("td", {}, t.links))))),
      h("div", { class: "card", style: "margin-top:16px" }, h("h2", {}, "Shared with other investigations"),
        o.shared_entities_with_other_investigations.length
          ? o.shared_entities_with_other_investigations.map((x) =>
              h("div", {}, `investigation ${x.investigation_id}: ${x.shared_entities} shared entities`))
          : h("div", { class: "muted" }, "none")));
  },
  async Graph(root) {
    const g = await api(`/api/inv/${state.inv}/graph`);
    if (!g.nodes.length) return root.append(h("div", { class: "card empty" }, "No entities yet."));
    const box = h("div", { class: "card" }, h("div", { id: "cy" }));
    root.append(box);
    const dark = matchMedia("(prefers-color-scheme: dark)").matches;
    const cy = cytoscape({
      container: $("#cy"), elements: [...g.nodes, ...g.edges],
      style: [
        { selector: "node", style: { label: "data(label)", "font-size": 9, color: dark ? "#e7e9ed" : "#1c1f24",
          "background-color": (n) => COLORS[n.data("type")] || "#888", width: 16, height: 16,
          "text-valign": "bottom", "text-margin-y": 3 } },
        { selector: "edge", style: { width: 1.2, "line-color": dark ? "#4a5361" : "#c3c9d4",
          "curve-style": "bezier", "target-arrow-shape": "triangle",
          "target-arrow-color": dark ? "#4a5361" : "#c3c9d4", label: "data(label)", "font-size": 7,
          color: dark ? "#9aa3b2" : "#667085" } },
        { selector: "edge[event]", style: { "line-style": "dashed", "target-arrow-shape": "none", label: "" } },
        { selector: ":selected", style: { "border-width": 3, "border-color": "#f5a524" } },
      ],
      layout: { name: "cose", animate: false, nodeRepulsion: 9000, idealEdgeLength: 90 },
    });
    cy.on("tap", "node", (ev) => showEntity(ev.target.data("eid")));
  },
  async Timeline(root) {
    const rows = await api(`/api/inv/${state.inv}/timeline`);
    if (!rows.length) return root.append(h("div", { class: "card empty" }, "No events yet."));
    root.append(h("div", { class: "card" }, h("table", {},
      h("tr", {}, h("th", {}, "when"), h("th", {}, "event"), h("th", {}, "who"), h("th", {}, "sources")),
      rows.map((v) => h("tr", {},
        h("td", { class: "small", style: "white-space:nowrap" }, v.time ? v.time.slice(0, 10) : "undated"),
        h("td", {}, h("span", { class: "chip" }, v.type), " ", v.description,
          v.reports > 1 ? h("span", { class: "chip ok" }, `${v.reports} reports`) : null,
          v.location ? h("div", { class: "small muted" }, "at " + v.location) : null,
          v.support && v.support.contradicted_by_events ? h("span", { class: "chip bad" }, "contradicted") : null),
        h("td", { class: "small" }, v.participants.map((p) =>
          h("a", { href: "#", onclick: (e) => { e.preventDefault(); showEntity(p.entity_id); } }, `${p.name} (${p.role})`, h("br")))),
        h("td", { class: "small" }, v.support ? `${v.support.independent_sources} indep.` : "",
          " ", v.evidence.join(" ")))))));
  },
  async Findings(root) {
    const d = await api(`/api/inv/${state.inv}/findings`);
    root.append(h("div", { class: "card" }, h("h2", {}, `Findings (${d.findings.length})`),
      d.findings.length ? h("div", { class: "list" }, d.findings.map((f) => h("div", {},
        h("b", {}, f.marker), " ", h("span", { class: "chip" }, f.kind),
        h("span", { class: "chip" }, `${f.epistemic_status} · ${Math.round(f.confidence * 100)}%`),
        h("div", {}, f.text), h("div", { class: "small muted" }, f.evidence.join(" "))))) :
        h("div", { class: "muted" }, "No findings yet. Run: osint analyze")),
      h("div", { class: "card", style: "margin-top:16px" }, h("h2", {}, "Links to other investigations"),
        d.links.length ? h("table", {}, d.links.map((l) => h("tr", {},
          h("td", {}, l.other_investigation.name), h("td", {}, h("span", { class: "chip" + (l.status === "confirmed" ? " ok" : "") }, l.status)),
          h("td", { class: "small" }, `${l.via.type}: ${l.via.name || l.via.description || l.via.id}`),
          h("td", { class: "small muted" }, l.explanation || "")))) : h("div", { class: "muted" }, "none")),
      h("div", { class: "card", style: "margin-top:16px" }, h("h2", {}, "Contradictions"),
        d.contradictions.length ? d.contradictions.map((c) => h("div", { class: "small" }, c.issue, h("div", { class: "muted" }, c.a, " vs ", c.b)))
          : h("div", { class: "muted" }, "none")));
  },
  async Reports(root) {
    const rows = await api(`/api/inv/${state.inv}/reports`);
    root.append(h("div", { class: "card" }, rows.length ? h("table", {},
      h("tr", {}, h("th", {}, "report"), h("th", {}, "status"), h("th", {}, "citation check")),
      rows.map((r) => h("tr", {},
        h("td", {}, h("a", { href: `/report/${r.id}`, target: "_blank" }, `R:${r.id} ${r.title}`)),
        h("td", {}, h("span", { class: "chip" + (r.status === "verified" ? " ok" : r.status === "draft" ? " warn" : "") }, r.status)),
        h("td", { class: "small muted" }, r.check || "")))) :
      h("div", { class: "muted" }, "No reports yet. Run: osint report")));
  },
  async Evidence(root) {
    const d = await api(`/api/inv/${state.inv}/evidence`);
    root.append(h("div", { class: "card" }, h("h2", {}, `Artifacts (${d.artifacts.length})`),
      h("table", {}, h("tr", {}, h("th", {}, "captured"), h("th", {}, "source"), h("th", {}, "proof")),
        d.artifacts.map((a) => h("tr", {},
          h("td", { class: "small" }, a.captured.slice(0, 16), a.posted ? h("div", { class: "muted" }, "posted " + a.posted.slice(0, 10)) : null),
          h("td", { class: "small" }, a.platform ? h("span", { class: "chip" }, a.platform) : null,
            a.blocked ? h("span", { class: "chip bad" }, "blocked: " + a.blocked) : null,
            a.route === "vpn" ? h("span", { class: "chip warn" }, "via VPN") : null,
            h("div", {}, a.url || ""), h("div", { class: "muted" }, `A:${a.id} · sha256 ${a.sha256.slice(0, 16)}…`)),
          h("td", { class: "small" },
            a.document ? h("a", { href: `/document/${a.document}`, target: "_blank" }, "text") : null, " ",
            a.captures.map((c) => [h("a", { href: `/capture/${c.id}`, target: "_blank" }, c.kind), " "])))))),
      h("div", { class: "card", style: "margin-top:16px" }, h("h2", {}, `Open review items (${d.review.length})`),
        h("div", { class: "list small" }, d.review.map((r) => h("div", {}, h("span", { class: "chip" }, r.kind), r.reason)))));
  },
};

views.Review = async function (root) {
  const d = await api(`/api/inv/${state.inv}/review`);
  const ACCEPT = { resolution_pair: "Merge", resolution_candidate: "Merge",
    sanctions_match: "Confirm listing", contradiction: "Acknowledge", finding_revision: "Apply" };
  const status = h("div", { class: "small muted", style: "margin-bottom:8px" });
  async function act(path, body, row) {
    const note = row.querySelector("input") ? row.querySelector("input").value : "";
    const r = await post(path, { ...body, note });
    if (r.ok) { row.style.opacity = 0.4; row.querySelectorAll("button").forEach((b) => (b.disabled = true));
      status.textContent = "Saved: " + JSON.stringify(r.data); }
    else status.textContent = "Not done: " + (r.data.error || "error");
  }
  const groups = {};
  for (const it of d.items) (groups[it.kind] = groups[it.kind] || []).push(it);
  const detail = (it) => {
    const p = it.payload || {};
    if (p.finding_text) return `“${p.finding_text}”  ${p.old} → ${p.new}${p.withdraw ? " (withdraw)" : ""}`;
    if (p.names) return `${p.names[0]}  vs  ${p.names[1]}  (score ${p.score})`;
    if (p.list_entry) return p.list_entry;
    if (p.a_description) return `${p.a_description}  vs  ${p.b_description}`;
    if (p.quote) return `quote: “${p.quote}”`;
    if (p.host) return p.host;
    return "";
  };
  const ORDER = ["integrity_alert", "finding_revision", "sanctions_match", "resolution_pair", "resolution_candidate",
    "contradiction", "unresolved", "quote_not_found", "weak_citation", "ontology", "blocked_source"];
  const rank = (k) => (ORDER.indexOf(k) < 0 ? 99 : ORDER.indexOf(k));
  const cards = Object.entries(groups).sort((x, y) => rank(x[0]) - rank(y[0])).map(([kind, items]) => h("div", { class: "card", style: "margin-bottom:16px" },
    h("h2", {}, `${kind.replaceAll("_", " ")} (${items.length})`),
    h("div", { class: "list" }, items.slice(0, 100).map((it) => {
      const row = h("div", {},
        h("div", {}, it.reason), h("div", { class: "small muted" }, detail(it)),
        h("div", { style: "margin-top:6px;display:flex;gap:6px;flex-wrap:wrap" },
          h("input", { placeholder: "note (optional)", style: "flex:1;min-width:140px;font:inherit;padding:3px 6px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink)" }),
          ACCEPT[kind] ? h("button", { onclick: () => act(`/api/review/item/${it.id}`, { decision: "accept" }, row) }, ACCEPT[kind]) : null,
          h("button", { onclick: () => act(`/api/review/item/${it.id}`, { decision: "reject" }, row) },
            ACCEPT[kind] ? "Reject" : "Dismiss")));
      return row;
    }))));
  const links = h("div", { class: "card", style: "margin-bottom:16px" }, h("h2", {}, `Link candidates (${d.links.length})`),
    d.links.length ? h("div", { class: "list" }, d.links.map((l) => {
      const row = h("div", {},
        h("div", {}, `${l.other_investigation.name} via ${l.via.type}: ${l.via.name || l.via.description || l.via.id}`,
          h("span", { class: "chip" }, `${l.tier} ${l.score}`)),
        h("div", { class: "small muted" }, l.explanation || ""),
        h("div", { style: "margin-top:6px;display:flex;gap:6px" },
          h("input", { placeholder: "why (recorded)", style: "flex:1;font:inherit;padding:3px 6px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink)" }),
          h("button", { onclick: () => act(`/api/review/link/${l.link_id}`, { decision: "confirm" }, row) }, "Confirm"),
          h("button", { onclick: () => act(`/api/review/link/${l.link_id}`, { decision: "reject" }, row) }, "Reject")));
      return row;
    })) : h("div", { class: "muted" }, "none"));
  root.append(status, links, ...cards);
  if (!d.items.length && !d.links.length) root.append(h("div", { class: "card empty" }, "Nothing to review."));
};

async function render() {
  const root = $("#view");
  root.replaceChildren(h("div", { class: "muted" }, "Loading…"));
  $("#tabs").replaceChildren(...TABS.map((t) =>
    h("button", { class: t === state.tab ? "on" : "", onclick: () => { state.tab = t; render(); } }, t)));
  const frag = h("div", {});
  root.replaceChildren(frag);  // attach first: the graph needs a laid-out container
  try { await views[state.tab](frag); } catch (e) { frag.append(h("div", { class: "card" }, "Error: " + e)); }
}

(async function init() {
  const invs = await api("/api/investigations");
  const sel = $("#inv");
  sel.replaceChildren(...invs.map((i) => h("option", { value: i.id }, `${i.name} (${i.counts.entity || 0} entities)`)));
  if (!invs.length) { $("#view").replaceChildren(h("div", { class: "card empty" }, "No investigations yet. Create one with: osint new")); return; }
  state.inv = Number(new URLSearchParams(location.search).get("inv")) || invs[invs.length - 1].id;
  sel.value = state.inv;
  sel.addEventListener("change", () => { state.inv = Number(sel.value); render(); });
  const cur = invs.find((i) => i.id === state.inv);
  $("#meta").textContent = cur && cur.open_tasks ? `${cur.open_tasks} task(s) queued` : "";
  render();
})();
</script>
</body>
</html>
